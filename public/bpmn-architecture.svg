    <rect x="0" y="0" width="40" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="-58" y="25" fill="#93c5fd" font-size="12" font-weight="700" transform="rotate(-90)" letter-spacing="1">👤 USER APP POOL</text>

