      <circle cx="20" cy="20" r="20" fill="url(#endGrad)" stroke="#f87171" stroke-width="3.5" filter="url(#glowRed)"/>
      <rect x="12" y="12" width="16" height="16" fill="#ffffff" rx="2"/>
