      <text x="14" y="56" fill="#94a3b8" font-size="10">Direct Cursor Update (&lt;150ms)</text>
    </g>
  </g>

  <!-- ==================== POOL 2: NATIVELINGO CORE ENGINE ==================== -->
  <g transform="translate(40, 215)">
