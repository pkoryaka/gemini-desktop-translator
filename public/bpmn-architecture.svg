    <rect x="0" y="0" width="40" height="275" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="-165" y="25" fill="#f97316" font-size="12" font-weight="700" transform="rotate(-90)" letter-spacing="1">⚡ NATIVELINGO CORE ENGINE</text>

    <!-- Service Task: Win32 Keystroke Capture -->
    <g transform="translate(60, 25)">
