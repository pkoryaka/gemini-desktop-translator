      <text x="14" y="39" fill="#f8fafc" font-size="11.5" font-weight="600">Position HUD at Cursor</text>
      <text x="14" y="54" fill="#cbd5e1" font-size="9.5">TTS Audio + Slang Breakdown</text>
    </g>

    <!-- End Event -->
