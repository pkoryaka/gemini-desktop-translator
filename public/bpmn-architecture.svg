  <!-- BYOM Gateway to 3 AI Engines -->
  <path d="M 220 625 L 235 625 L 235 557 L 285 557" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#greenArrow)"/>
  <path d="M 220 625 L 285 625" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#purpleArrow)"/>
